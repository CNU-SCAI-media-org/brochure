<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.page{padding:var(--m) var(--m) 80px}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
figure{margin:0;position:relative}
figure img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
figcaption{position:absolute;left:0;bottom:0;padding:12px 18px;color:#fff;font-size:21px;font-weight:600;
  background:linear-gradient(0deg,rgba(23,56,107,.85),transparent);border-radius:0 0 12px 12px;width:100%}
</style></head>
<body><div class="page">
  <div class="head"><span class="eyebrow">Campus Moments</span></div>
  <div class="g">
    <figure style="grid-column:span 6;height:400px"><img src="../../content/img/p22_00_0.png" alt=""><figcaption>2026 공대체전</figcaption></figure>
    <figure style="grid-column:span 6;height:400px"><img src="../../content/img/p22_06_0.png" alt=""><figcaption>2026 공대체전 컴퓨터인공지능학부 3등</figcaption></figure>
    <figure style="grid-column:span 6;height:400px"><img src="../../content/img/p22_03_0.png" alt=""><figcaption>2026 공대체전 1학년 여자 피구 우승</figcaption></figure>
    <figure style="grid-column:span 6;height:400px"><img src="../../content/img/p23_05_0.png" alt=""><figcaption>ENGINEERING FAIR 컴퓨터인공지능학부 부스</figcaption></figure>
    <figure style="grid-column:span 7;height:430px"><img src="../../content/img/p23_07_0.png" alt=""><figcaption>2025학년도 전기 학위 수여식</figcaption></figure>
    <figure style="grid-column:span 5;height:430px"><img src="../../content/img/p23_08_0.png" alt=""></figure>
    <figure style="grid-column:span 12;height:500px"><img src="../../content/img/crop_p23_building.png" alt="" style="object-fit:cover;object-position:center bottom"></figure>
  </div>
</div></body></html>
