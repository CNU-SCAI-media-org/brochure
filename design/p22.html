<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.page{padding:var(--m) var(--m) 80px}
.big{font-size:150px;line-height:.9;font-weight:900;color:var(--navy);letter-spacing:-.04em}
.sub{font-size:26px;letter-spacing:.2em;color:var(--sky);font-weight:600;margin-top:18px;text-transform:uppercase}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:40px}
figure{margin:0;position:relative}
figure img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
figcaption{position:absolute;left:0;bottom:0;padding:12px 18px;color:#fff;font-size:21px;font-weight:600;
  background:linear-gradient(0deg,rgba(23,56,107,.85),transparent);border-radius:0 0 12px 12px;width:100%}
</style></head>
<body><div class="page">
  <div class="head"><span class="eyebrow">Campus Moments</span></div>
  <div class="big">CAMPUS<br>MOMENTS</div>
  <div class="sub">Spring Semester 2026</div>
  <div class="g">
    <figure style="grid-column:span 7;height:470px"><img src="../../content/img/p22_05_0.png" alt=""><figcaption>신입생 오리엔테이션</figcaption></figure>
    <figure style="grid-column:span 5;height:470px"><img src="../../content/img/p22_02_0.png" alt=""></figure>
    <figure style="grid-column:span 7;height:470px"><img src="../../content/img/p22_04_0.png" alt=""><figcaption>2026 컴퓨터인공지능학부 MT</figcaption></figure>
    <figure style="grid-column:span 5;height:470px"><img src="../../content/img/p23_06_0.png" alt=""></figure>
    <figure style="grid-column:span 6;height:440px"><img src="../../content/img/p22_07_0.png" alt=""><figcaption>해오름제</figcaption></figure>
    <figure style="grid-column:span 6;height:440px"><img src="../../content/img/p22_01_0.png" alt=""></figure>
  </div>
</div></body></html>
