<style>
:root{
  --bg:#F3F4F6; --ink:#1F2937; --icon:#374151; --muted:#6B7280; --line:#D5D9E0;
  --cnu:#1B4FA0; --paper:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;
}

/* ── top-right icon toolbar ── */
.top{flex:0 0 auto;display:flex;justify-content:flex-end;gap:6px;
  padding:14px 22px 0;position:relative;z-index:10}
.ic{width:46px;height:46px;border:0;background:none;color:var(--icon);border-radius:8px;
  display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.ic:hover{background:rgba(0,0,0,.06)}
.ic[aria-pressed="true"]{color:var(--cnu)}
.ic:focus-visible{outline:2px solid var(--cnu);outline-offset:2px}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

main{flex:1 1 auto;position:relative;min-height:0;display:flex;
  align-items:center;justify-content:center;padding:18px 0 8px;z-index:2}

/* stage is sized in JS — never overflows */
.stage{position:relative;flex:0 0 auto}
.stack{position:absolute;inset:0;pointer-events:none}
.stack i{position:absolute;top:5px;bottom:5px;right:0;width:9px;
  background:linear-gradient(90deg,#E6E9EE,#C4CBD5);border-radius:0 3px 3px 0;
  transition:opacity .2s,transform .2s}
.book{position:absolute;inset:0;background:var(--paper);border-radius:2px;
  overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.16)}
.book.duo{background:transparent;box-shadow:none;overflow:visible;perspective:2600px}
.book.duo::after{display:none}
.book:not(.duo) .half,.book:not(.duo) .leaf{display:none}
.book.duo .sheet{display:none}
.sheet{position:absolute;inset:0;display:flex;background:var(--paper)}
.sheet img{flex:1 1 0;min-width:0;height:100%;object-fit:contain;display:block;
  background:var(--paper)}

/* ── two-page book: static halves + a 3D flipping leaf ── */
.half{position:absolute;top:0;bottom:0;width:50%;background:var(--paper);overflow:hidden}
.half.lh{left:0;border-radius:2px 0 0 2px;box-shadow:0 10px 30px rgba(15,23,42,.16)}
.half.rh{right:0;border-radius:0 2px 2px 0;box-shadow:0 10px 30px rgba(15,23,42,.16)}
.half img,.face img{width:100%;height:100%;object-fit:contain;display:block}
.half.lh::before{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;z-index:2;
  pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.10))}
.half.rh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;z-index:2;
  pointer-events:none;background:linear-gradient(270deg,transparent,rgba(0,0,0,.10))}
.half.empty{background:transparent;box-shadow:none}
.half.empty::before{display:none}
.leaf{position:absolute;top:0;bottom:0;width:50%;display:none;z-index:6;
  transform-style:preserve-3d;pointer-events:none}
.leaf.fwd{left:50%;transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.10),transparent 28%,
    transparent 72%,rgba(0,0,0,.04))}
.face.empty{background:transparent}
.book::after{content:"";position:absolute;inset:0 auto 0 0;width:22px;z-index:3;
  pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.10),transparent)}
.over{z-index:2}
@keyframes slideOut{to{transform:translateX(-6%) scale(.986);opacity:0}}
@keyframes slideIn{from{transform:translateX(-6%) scale(.986);opacity:0}}
.over.out{animation:slideOut .22s cubic-bezier(.4,0,.2,1) forwards}
.over.in{animation:slideIn .22s cubic-bezier(.4,0,.2,1) forwards}
@media (prefers-reduced-motion:reduce){.over.out,.over.in{animation-duration:.01s}}

.zone{position:absolute;top:0;bottom:0;width:50%;z-index:4;cursor:pointer}
.zone.l{left:0} .zone.r{right:0}

/* ── zoom: Ctrl+휠 / Ctrl+(+ − 0) / 더블클릭, 확대 중엔 드래그로 이동 ── */
.zoomwin{position:absolute;inset:0}
.book{transform-origin:0 0}
.stage.zoomed .zoomwin{overflow:hidden;cursor:grab;border-radius:2px}
.stage.zoomed.panning .zoomwin{cursor:grabbing}
.stage.zoomed .zone,.stage.zoomed .stack{display:none}
.stage.zoomed .book{transition:none}

/* thin chevrons just outside the book */
.nav{position:absolute;top:50%;translate:0 -50%;z-index:5;width:64px;height:120px;
  border:0;background:none;color:#8A9099;cursor:pointer;display:grid;place-items:center;
  transition:color .16s}
.nav:hover:not(:disabled){color:var(--ink)}
.nav:disabled{opacity:.25;cursor:default}
.nav:focus-visible{outline:2px solid var(--cnu);outline-offset:3px}
.nav.prev{right:calc(100% + 22px)} .nav.next{left:calc(100% + 22px)}
.nav svg{width:56px;height:100px;fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}

/* ── bottom: progress slider + "N of M" ── */
.bottom{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:14px 0 20px;margin:0 auto;max-width:calc(100% - 32px)}
#slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
  cursor:pointer;background:linear-gradient(90deg,var(--cnu) var(--pct,0%),var(--line) var(--pct,0%))}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--cnu);border:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;
  background:var(--cnu);border:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#slider:focus-visible{outline:2px solid var(--cnu);outline-offset:6px}
.count{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;word-spacing:.35em}

/* ── thumbnail grid + search overlay ── */
#grid{position:fixed;inset:0;z-index:30;background:rgba(243,244,246,.97);
  display:flex;flex-direction:column}
.ov-head{display:flex;gap:10px;align-items:center;padding:18px 22px;width:100%;
  max-width:1100px;margin:0 auto}
#q{flex:1;font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink)}
#q:focus{outline:none;border-color:var(--cnu)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px;
  padding:8px 22px 40px;width:100%;max-width:1100px;margin:0 auto;overflow-y:auto}
.strip button{padding:0;border:0;background:none;cursor:pointer;text-align:left;
  font:inherit;color:var(--muted);font-size:12px;line-height:1.4}
.strip button img{width:100%;display:block;margin-bottom:6px;border-radius:2px;
  box-shadow:0 3px 10px rgba(15,23,42,.14);outline:2px solid transparent;outline-offset:2px}
.strip button:hover img{outline-color:var(--line)}
.strip button[aria-current="true"]{color:var(--cnu);font-weight:600}
.strip button[aria-current="true"] img{outline-color:var(--cnu)}
.strip button:focus-visible img{outline-color:var(--cnu)}
.none{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:30px 0}

/* ── info popover ── */
#info{position:fixed;top:68px;right:22px;z-index:20;width:min(300px,calc(100vw - 32px));
  background:#fff;border-radius:10px;padding:18px;box-shadow:0 12px 36px rgba(15,23,42,.18)}
#info h1{font-size:15px;font-weight:700;line-height:1.4}
#info p{font-size:12px;color:var(--muted);margin:4px 0 14px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{border:1px solid var(--line);background:none;color:var(--icon);font:inherit;
  font-size:12px;padding:6px 11px;border-radius:6px;cursor:pointer}
.opts button:hover{border-color:var(--cnu)}
.opts button[aria-pressed="true"]{border-color:var(--cnu);color:var(--cnu);background:rgba(27,79,160,.06)}

#toast{position:fixed;left:50%;bottom:96px;translate:-50% 0;z-index:50;
  background:#111827;color:#fff;font-size:13px;padding:8px 14px;border-radius:6px;
  opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:760px){
  .top{padding:8px 8px 0;gap:0;justify-content:space-between}
  .ic{width:40px;height:40px}
  .ic svg{width:23px;height:23px}
  .nav{display:none}
}

/* ── per-page feedback panel ── */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,94vw);z-index:40;
  background:#fff;border-left:1px solid var(--line);display:flex;
  flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
#panel.open{transform:translateX(0);box-shadow:-18px 0 44px rgba(15,23,42,.14)}
.p-head{display:flex;align-items:center;gap:9px;padding:13px 14px;
  border-bottom:1px solid var(--line)}
.p-head .p-title{font-size:13px;font-weight:600;color:var(--ink)}
.p-head select{margin-left:auto;background:#fff;color:var(--ink);font:inherit;
  font-size:12px;border:1px solid var(--line);border-radius:4px;padding:4px 6px;
  max-width:150px}
.p-head button{border:none;background:none;color:var(--muted);font-size:18px;
  cursor:pointer;padding:2px 5px;line-height:1}
.p-head button:hover{color:var(--ink)}
#fbList{flex:1 1 auto;overflow-y:auto;padding:12px 14px;display:flex;
  flex-direction:column;gap:9px;scrollbar-width:thin}
.fb-item{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:#F9FAFB}
.fb-item.done{opacity:.55}
.fb-meta{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:4px}
.fb-meta b{color:var(--cnu);font-weight:600}
.fb-meta .ok{margin-left:auto;color:#2F8F5B}
.fb-text{font-size:13px;line-height:1.55;color:var(--ink);white-space:pre-wrap;
  word-break:break-word}
.fb-none{font-size:12px;color:var(--muted);text-align:center;padding:26px 0}
#fbForm{border-top:1px solid var(--line);padding:12px 14px;display:flex;
  flex-direction:column;gap:7px}
#fbForm input,#fbForm textarea{background:#fff;border:1px solid var(--line);
  border-radius:4px;color:var(--ink);font:inherit;font-size:13px;padding:7px 9px}
#fbForm textarea{resize:none;height:74px;line-height:1.5}
#fbForm input:focus,#fbForm textarea:focus{outline:none;border-color:var(--cnu)}
#fbForm .p-send{border:0;background:var(--cnu);color:#fff;font:inherit;font-size:13px;
  padding:8px;border-radius:4px;cursor:pointer;transition:opacity .15s}
#fbForm .p-send:hover{opacity:.88}
#fbForm .p-send:disabled{opacity:.4;cursor:default}
.p-note{font-size:11px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>

<div class="top" role="toolbar" aria-label="보기 도구">

  <button class="ic" id="gridBtn" title="전체 페이지" aria-label="전체 페이지">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
  <button class="ic" id="searchBtn" title="검색" aria-label="검색">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  <button class="ic" id="link" title="공유" aria-label="공유">

  <button class="ic" id="print" title="인쇄" aria-label="인쇄">
    <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1 1 0 01-1-1v-6a1 1 0 011-1h14a1 1 0 011 1v6a1 1 0 01-1 1h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></svg></button>
  <button class="ic" id="save" title="이 페이지 저장" aria-label="이 페이지 저장">
    <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></button>
  <button class="ic" id="fb" title="의견 남기기" aria-label="의견 남기기">
    <svg viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 011 1v9a1 1 0 01-1 1h-8l-4 3.5V16H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg></button>
  <button class="ic" id="infoBtn" title="정보 · 보기 설정" aria-label="정보 · 보기 설정" aria-expanded="false">

</div>

<div id="info" hidden>
  <h1>충남대학교 공과대학 컴퓨터인공지능학부<br>한학기 성과 모음</h1>
  <p>2026학년도 1학기</p>
  <p>확대: Ctrl + 마우스 휠 또는 Ctrl + / − (Ctrl 0 원래 크기), 확대 중에는 드래그로 이동</p>

    <button id="dual">두쪽 보기</button>

  </div>
</div>

<main id="main">
  <div class="stage" id="stage">
    <button class="nav prev" id="prev" aria-label="이전 페이지">
      <svg viewBox="0 0 56 100"><path d="M46 6L10 50l36 44"/></svg></button>
    <div class="stack" id="stack"></div>
    <div class="zoomwin" id="zoomwin">
    <div class="book" id="book">
      <div class="half lh" id="lh"></div>
      <div class="half rh" id="rh"></div>

        <div class="face front" id="lf"></div>

      </div>

      <div class="sheet over"  id="over"></div>
    </div>
    </div>
    <div class="zone l" id="zl"></div>

<div id="grid" hidden role="dialog" aria-label="전체 페이지">

</aside>

<script>
const PAGES = [{"src": "pages/01.jpg", "thumb": "thumbs/01.jpg", "label": "표지", "w": 1588, "h": 2246}, {"src": "pages/02.jpg", "thumb": "thumbs/02.jpg", "label": "학부 소개", "w": 1588, "h": 2246}, {"src": "pages/03.jpg", "thumb": "thumbs/03.jpg", "label": "목차", "w": 1588, "h": 2246}, {"src": "pages/04.jpg", "thumb": "thumbs/04.jpg", "label": "인사말", "w": 1588, "h": 2246}, {"src": "pages/05.jpg", "thumb": "thumbs/05.jpg", "label": "진로현황", "w": 1588, "h": 2246}, {"src": "pages/06.jpg", "thumb": "thumbs/06.jpg", "label": "연혁", "w": 1588, "h": 2246}, {"src": "pages/07.jpg", "thumb": "thumbs/07.jpg", "label": "연혁", "w": 1588, "h": 2246}, {"src": "pages/08.jpg", "thumb": "thumbs/08.jpg", "label": "SW중심대학", "w": 1588, "h": 2246}, {"src": "pages/09.jpg", "thumb": "thumbs/09.jpg", "label": "BK21 plus", "w": 1588, "h": 2246}, {"src": "pages/10.jpg", "thumb": "thumbs/10.jpg", "label": "정보보호 특성화대학", "w": 1588, "h": 2246}, {"src": "pages/11.jpg", "thumb": "thumbs/11.jpg", "label": "COSS", "w": 1588, "h": 2246}, {"src": "pages/12.jpg", "thumb": "thumbs/12.jpg", "label": "AI 인재양성 부트캠프", "w": 1588, "h": 2246}, {"src": "pages/13.jpg", "thumb": "thumbs/13.jpg", "label": "동아리 성과", "w": 1588, "h": 2246}, {"src": "pages/14.jpg", "thumb": "thumbs/14.jpg", "label": "동아리 · ANA · SPG · CRAFT:ON", "w": 1588, "h": 2246}, {"src": "pages/15.jpg", "thumb": "thumbs/15.jpg", "label": "동아리 · ARGOS · ADMIN · dAiv", "w": 1588, "h": 2246}, {"src": "pages/16.jpg", "thumb": "thumbs/16.jpg", "label": "대학원 성과", "w": 1588, "h": 2246}, {"src": "pages/17.jpg", "thumb": "thumbs/17.jpg", "label": "수상", "w": 1588, "h": 2246}, {"src": "pages/18.jpg", "thumb": "thumbs/18.jpg", "label": "학부생 성과", "w": 1588, "h": 2246}, {"src": "pages/19.jpg", "thumb": "thumbs/19.jpg", "label": "학부 NEWS", "w": 1588, "h": 2246}, {"src": "pages/20.jpg", "thumb": "thumbs/20.jpg", "label": "학교 행사", "w": 1588, "h": 2246}, {"src": "pages/21.jpg", "thumb": "thumbs/21.jpg", "label": "학교 행사", "w": 1588, "h": 2246}, {"src": "pages/22.jpg", "thumb": "thumbs/22.jpg", "label": "CAMPUS MOMENTS", "w": 1588, "h": 2246}, {"src": "pages/23.jpg", "thumb": "thumbs/23.jpg", "label": "CAMPUS MOMENTS", "w": 1588, "h": 2246}, {"src": "pages/24.jpg", "thumb": "thumbs/24.jpg", "label": "마무리", "w": 1588, "h": 2246}];
const $=id=>document.getElementById(id);
const stage=$('stage'), main=$('main'), over=$('over'), under=$('under'), strip=$('strip'), stack=$('stack');
const book=$('book'), lh=$('lh'), rh=$('rh'), leaf=$('leaf'), lf=$('lf'), lb=$('lb');
const slider=$('slider'), grid=$('grid'), q=$('q'), info=$('info');
const V='14'; PAGES.forEach(p=>{p.src+='?v='+V; p.thumb+='?v='+V;});
const RATIO = PAGES[0].w / PAGES[0].h;
let i=0, busy=false, useAnim=true, spreadMode=innerWidth>860;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = PAGES.length;
/* spread s=0 is the cover alone; s>=1 shows pages [2s-1, 2s] */
const sOf = p => p===0 ? 0 : Math.ceil(p/2);
const sPages = s => s===0 ? [0] : [2*s-1, 2*s].filter(k=>k<N);
const vis = () => spreadMode ? sPages(sOf(i)) : [i];
/* which page sits on each side of spread s (null = bare table, no paper) */
const lay = s => ({ left:  s===0 ? null : (2*s-1 < N ? 2*s-1 : null),
                    right: s===0 ? 0    : (2*s   < N ? 2*s   : null) });
const imgTag = k => `<img src="${PAGES[k].src}" alt="${k+1}페이지 ${PAGES[k].label}">`;
function render(el, ps){
  el.innerHTML = ps.map(imgTag).join('');
}
function setPane(el, p){
  el.classList.toggle('empty', p==null);
  el.innerHTML = p==null ? '' : imgTag(p);
}
function renderSpread(s){ setPane(lh, lay(s).left); setPane(rh, lay(s).right); }
function applyMode(){
  book.classList.toggle('duo', spreadMode);
  if(spreadMode) renderSpread(sOf(i));
  else { render(under,[i]); render(over,[i]); }
}

$('tot').textContent = N;
slider.max = N;

/* ── size the stage from the box that actually exists ── */
function fit(){
  const pv = spreadMode ? 2 : 1;
  const r = main.getBoundingClientRect();
  const side = r.width > 760 ? 220 : 24;
  let h = r.height, w = h * RATIO * pv;
  const maxW = r.width - side;
  if (w > maxW){ w = maxW; h = w / (RATIO * pv); }
  stage.style.width  = Math.floor(w) + 'px';
  stage.style.height = Math.floor(h) + 'px';
  $('bottom').style.width = Math.floor(w) + 'px';
  if(typeof resetZoom==='function') resetZoom();
}
new ResizeObserver(()=>fit()).observe(main);
addEventListener('orientationchange', () => setTimeout(fit, 120));

/* ── paper edges: thinner as you advance ── */
for (let k=0;k<4;k++) stack.appendChild(document.createElement('i'));
function drawStack(){
  const ps = vis();
  const left = N - 1 - ps[ps.length-1];
  [...stack.children].forEach((e,k)=>{
    const on = k < Math.min(4,left);
    e.style.opacity = on ? (0.46 - k*0.085).toFixed(2) : 0;
    e.style.transform = `translateX(${on ? (k+1)*4 : 0}px) scaleY(${1-(k+1)*0.011})`;
  });
}

PAGES.forEach((p,k)=>{
  const b=document.createElement('button');
  b.innerHTML=`<img src="${p.thumb}" alt="" loading="lazy">${k+1}. ${p.label}`;
  b.setAttribute('aria-label',`${k+1}페이지 ${p.label}`);
  b.onclick=()=>{ closeGrid(); go(k); };
  strip.appendChild(b);
});
const noHit=document.createElement('div');
noHit.className='none'; noHit.textContent='검색 결과가 없습니다.'; noHit.hidden=true;
strip.appendChild(noHit);

function setSlider(n){
  slider.value=n;
  slider.style.setProperty('--pct', (N>1 ? (n-1)/(N-1)*100 : 0)+'%');
}
function sync(){
  const ps=vis(), nums=ps.map(k=>k+1).join('–');
  $('cur').textContent=nums;
  setSlider(ps[0]+1);
  $('prev').disabled=ps[0]===0;
  $('next').disabled=ps[ps.length-1]===N-1;
  PAGES.forEach((_,k)=>strip.children[k].setAttribute('aria-current',ps.includes(k)));
  document.title=`${nums}. ${PAGES[ps[0]].label} · 컴퓨터인공지능학부 한학기 성과 모음`;
  history.replaceState(null,'',`#p${ps[0]+1}`);
  fit(); drawStack(); warm(); fbSync();
}

function setFace(el, p){
  el.classList.toggle('empty', p==null);
  el.innerHTML = p==null ? '' : imgTag(p);
}
function go(n){
  n=Math.max(0,Math.min(N-1,n));
  resetZoom();
  const curS = spreadMode ? sOf(i) : i;
  const tgtS = spreadMode ? sOf(n) : n;
  if(tgtS===curS||busy){ sync(); return; }
  const dir = tgtS>curS ? 1 : -1;
  const tp = spreadMode ? sPages(tgtS) : [n];  // target pages

  if(!useAnim || reduced){
    i=tp[0];
    if(spreadMode) renderSpread(tgtS);
    else { render(under,tp); render(over,tp); }
    sync(); return;
  }
  busy=true;

  if(!spreadMode){                 // 한쪽 보기: 슬라이드
    if(dir>0){
      render(under,tp);
      over.className='sheet over out';
    }else{
      render(under,[i]);
      render(over,tp);
      over.className='sheet over in';
    }
    setTimeout(()=>{
      i=tp[0];
      over.className='sheet over';
      render(over,tp); render(under,tp);
      sync(); busy=false;
    },230);
    return;
  }

  // 두쪽 보기: 낱장이 책등을 축으로 3D 회전
  const A=lay(curS), B=lay(tgtS);
  if(dir>0){                       // 오른쪽 장을 왼쪽으로 젖힘
    setPane(lh, A.left); setPane(rh, B.right);
    setFace(lf, A.right); setFace(lb, B.left);
    leaf.className='leaf fwd';
  }else{                           // 왼쪽 장을 오른쪽으로 되넘김
    setPane(lh, B.left); setPane(rh, A.right);
    setFace(lf, A.left); setFace(lb, B.right);
    leaf.className='leaf bwd';
  }
  leaf.style.transition='none';
  leaf.style.transform='rotateY(0deg)';
  leaf.style.display='block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    leaf.style.transition='transform .65s cubic-bezier(.36,.1,.22,1)';
    leaf.style.transform=`rotateY(${dir>0?-180:180}deg)`;
  }));
  setTimeout(()=>{
    i=tp[0]; renderSpread(tgtS);
    leaf.style.display='none';
    leaf.style.transition='none';
    leaf.style.transform='rotateY(0deg)';
    sync(); busy=false;
  },700);
}
const nextP=()=>{const ps=vis();go(ps[ps.length-1]+1)};
const prevP=()=>go(vis()[0]-1);

$('next').onclick=nextP; $('prev').onclick=prevP;
$('zr').onclick=nextP;   $('zl').onclick=prevP;

/* 드래그 중에는 숫자만 미리 보여주고, 놓았을 때 이동 */
slider.oninput=()=>{ $('cur').textContent=slider.value; setSlider(+slider.value); };
slider.onchange=()=>go(+slider.value-1);

addEventListener('keydown',e=>{
  if(e.target&&e.target.matches&&e.target.matches('input,textarea,select')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){nextP();e.preventDefault();}
  if(e.key==='ArrowLeft' ||e.key==='PageUp'  ){prevP();e.preventDefault();}
  if(e.key==='Home')go(0);
  if(e.key==='End')go(PAGES.length-1);
});

let x0=null,y0=null;
main.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
main.addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Z===1 && Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)) dx<0?nextP():prevP();
  x0=null;
},{passive:true});

/* ── 확대/축소: Ctrl+휠(트랙패드 핀치 포함) · Ctrl + − 0 · 툴바 버튼, 확대 중엔 드래그로 이동 ── */
const zoomwin=$('zoomwin'), ZMAX=3;
let Z=1, ZX=0, ZY=0, pan=null;
function applyZoom(){
  book.style.transform = Z===1 ? '' : `translate(${ZX}px,${ZY}px) scale(${Z})`;
  stage.classList.toggle('zoomed', Z>1);
  $('zoomOut').disabled = Z<=1; $('zoomIn').disabled = Z>=ZMAX;
}
function clampPan(){
  const W=zoomwin.clientWidth, H=zoomwin.clientHeight;
  ZX=Math.min(0,Math.max(W-W*Z,ZX)); ZY=Math.min(0,Math.max(H-H*Z,ZY));
}
function zoomTo(z, cx, cy){            // cx,cy: 화면 좌표. 없으면 가운데 기준
  z=Math.max(1,Math.min(ZMAX,z));
  if(z===Z) return;
  const r=zoomwin.getBoundingClientRect();
  const px = cx==null ? r.width/2 : cx-r.left, py = cy==null ? r.height/2 : cy-r.top;
  ZX = px-(px-ZX)*(z/Z); ZY = py-(py-ZY)*(z/Z); Z=z;   // 커서 아래 지점이 그 자리에 머물도록
  if(Z===1){ ZX=ZY=0; } else clampPan();
  applyZoom(); toast(`${Math.round(Z*100)}%`);
}
function resetZoom(){ if(Z!==1){ Z=1; ZX=ZY=0; applyZoom(); } }
main.addEventListener('wheel',e=>{
  if(!e.ctrlKey) return;
  e.preventDefault();
  zoomTo(Z*(e.deltaY<0?1.15:1/1.15), e.clientX, e.clientY);
},{passive:false});
addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey) || (e.target.matches&&e.target.matches('input,textarea,select'))) return;
  if(e.key==='='||e.key==='+'){ zoomTo(Z*1.25); e.preventDefault(); }
  else if(e.key==='-'){ zoomTo(Z/1.25); e.preventDefault(); }
  else if(e.key==='0'){ zoomTo(1); e.preventDefault(); }
});
$('zoomIn').onclick=()=>zoomTo(Z*1.25);
$('zoomOut').onclick=()=>zoomTo(Z/1.25);
zoomwin.addEventListener('pointerdown',e=>{
  if(Z===1) return;
  pan={x:e.clientX,y:e.clientY,zx:ZX,zy:ZY}; zoomwin.setPointerCapture(e.pointerId);
  stage.classList.add('panning'); e.preventDefault();
});
zoomwin.addEventListener('pointermove',e=>{
  if(!pan) return;
  ZX=pan.zx+(e.clientX-pan.x); ZY=pan.zy+(e.clientY-pan.y); clampPan(); applyZoom();
});
const endPan=()=>{ pan=null; stage.classList.remove('panning'); };
zoomwin.addEventListener('pointerup',endPan); zoomwin.addEventListener('pointercancel',endPan);
applyZoom();

/* ── toolbar ── */
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1500);
}
function openGrid(focusSearch){
  closeInfo(); grid.hidden=false;
  const cur=strip.children[vis()[0]];
  cur.scrollIntoView({block:'center'});
  if(focusSearch) q.focus(); else cur.focus();
}
function closeGrid(){ grid.hidden=true; }
function closeInfo(){ info.hidden=true; $('infoBtn').setAttribute('aria-expanded',false); }
$('gridBtn').onclick=()=>openGrid(false);
$('searchBtn').onclick=()=>openGrid(true);
$('gridClose').onclick=closeGrid;
q.oninput=()=>{
  const t=q.value.trim().toLowerCase(); let hits=0;
  PAGES.forEach((p,k)=>{
    const hit=!t || `${k+1} ${p.label}`.toLowerCase().includes(t);
    strip.children[k].hidden=!hit; hits+=hit;
  });
  noHit.hidden=hits>0;
};
q.onkeydown=e=>{ if(e.key==='Enter'){ const b=[...strip.children].find(b=>b.tagName==='BUTTON'&&!b.hidden); if(b) b.click(); } };
$('infoBtn').onclick=()=>{
  info.hidden=!info.hidden;
  $('infoBtn').setAttribute('aria-expanded',!info.hidden);
};
document.addEventListener('click',e=>{
  if(!info.hidden && !info.contains(e.target) && !$('infoBtn').contains(e.target)) closeInfo();
});

$('anim').onclick=e=>{useAnim=!useAnim;e.currentTarget.setAttribute('aria-pressed',useAnim)};
$('link').onclick=async()=>{
  if(navigator.share){
    try{ await navigator.share({title:document.title, url:location.href}); return; }
    catch(err){ if(err.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(location.href); toast('링크가 복사되었습니다'); }
  catch{ prompt('링크를 복사하세요', location.href); }
};
$('print').onclick=()=>open('brochure.pdf','_blank');
$('save').onclick=()=>{
  vis().forEach((k,j)=>setTimeout(()=>{
    const a=document.createElement('a');
    a.href=PAGES[k].src; a.download=`브로셔_${String(k+1).padStart(2,'0')}.jpg`; a.click();
  },j*350));
};
$('pdf').onclick=()=>{
  const a=document.createElement('a');
  a.href='brochure.pdf'; a.download='CNU_컴퓨터인공지능학부_성과모음.pdf'; a.click();
};
$('dual').setAttribute('aria-pressed',spreadMode);
$('dual').onclick=e=>{
  spreadMode=!spreadMode;
  e.currentTarget.setAttribute('aria-pressed',spreadMode);
  applyMode(); fit(); sync();
};
$('full').onclick=()=>document.fullscreenElement
  ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange',()=>{
  const on=!!document.fullscreenElement, t=on?'전체화면 해제':'전체화면';
  $('full').title=t; $('full').setAttribute('aria-label',t);
  $('full').setAttribute('aria-pressed',on);
  setTimeout(fit,120);
});

function warm(){[i-1,i+1,i+2].forEach(k=>{
  if(k>=0&&k<PAGES.length&&!PAGES[k]._w){PAGES[k]._w=1;const im=new Image();im.src=PAGES[k].src;}
});}
const hash=parseInt((location.hash.match(/p(\d+)/)||[])[1]);
if(hash>=1&&hash<=PAGES.length) i=hash-1;
applyMode();
addEventListener('hashchange',()=>{
  const h=parseInt((location.hash.match(/p(\d+)/)||[])[1]);
  if(h>=1&&h<=PAGES.length&&h-1!==i) go(h-1);
});

/* ── 페이지별 의견: 노션 '브로셔 의견' DB에 쌓임 (feedback/Code.gs 중계) ── */
/* 의견 기능은 주소에 ?review 가 붙어 있을 때만 켠다 (예: …/brochure/?review) */
const FB_URL = !new URLSearchParams(location.search).has('review') ? '' : 'https://script.google.com/macros/s/AKfycbw1KhWAYTlhnRyi9puV9w1Qgn39a3stfysiAAzOjaYrx2mk4sJzy73_lzFUYpflF3A/exec'; /* Apps Script 웹앱 배포 URL(…/exec)을 넣으면 '의견' 버튼이 켜집니다. 설정법: feedback/README.md */
const panel=$('panel'), fbList=$('fbList'), fbPageSel=$('fbPage'), fbCache={};
if(!FB_URL) $('fb').style.display='none';
PAGES.forEach((p,k)=>{
  const o=document.createElement('option');
  o.value=k+1; o.textContent=`${k+1}p · ${p.label}`;
  fbPageSel.appendChild(o);
});
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawFb(rows){
  fbList.innerHTML = rows.length ? rows.map(d=>{
    const t=new Date(d.ts);
    const when=`${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`;
    return `<div class="fb-item${d.done?' done':''}"><div class="fb-meta"><b>${esc(d.name||'익명')}</b><span>${when}</span>${d.done?'<span class="ok">✓ 반영</span>':''}</div><div class="fb-text">${esc(d.text||'')}</div></div>`;
  }).join('') : '<div class="fb-none">아직 등록된 의견이 없습니다.<br>첫 의견을 남겨주세요.</div>';
}
async function loadFb(){
  const p=+fbPageSel.value;
  if(fbCache[p]) drawFb(fbCache[p]); else fbList.innerHTML='<div class="fb-none">불러오는 중…</div>';
  try{
    const d=await (await fetch(`${FB_URL}?page=${p}`)).json();
    if(d.error) throw new Error(d.error);
    fbCache[p]=d.rows;
    if(+fbPageSel.value===p) drawFb(d.rows);
  }catch(err){
    if(!fbCache[p]) fbList.innerHTML='<div class="fb-none">의견을 불러오지 못했습니다.</div>';
    console.error(err);
  }
}
function fbSync(){
  if(!panel.classList.contains('open')) return;
  const p=vis()[0]+1;
  if(+fbPageSel.value!==p){ fbPageSel.value=p; loadFb(); }
}
$('fb').onclick=()=>{ closeInfo(); panel.classList.add('open'); fbPageSel.value=vis()[0]+1; loadFb(); };
$('fbClose').onclick=()=>panel.classList.remove('open');
fbPageSel.onchange=loadFb;
$('fbForm').onsubmit=async e=>{
  e.preventDefault();
  const text=$('fbText').value.trim(); if(!text) return;
  const btn=$('fbSend'); btn.disabled=true;
  try{
    /* Content-Type을 지정하지 않아야(simple request) Apps Script가 CORS 사전요청 없이 받는다 */
    const d=await (await fetch(FB_URL,{method:'POST',body:JSON.stringify({
      page:+fbPageSel.value, name:$('fbName').value.trim().slice(0,30), text:text.slice(0,500)
    })})).json();
    if(d.error) throw new Error(d.error);
    $('fbText').value=''; delete fbCache[+fbPageSel.value]; loadFb();
  }catch(err){ alert('등록에 실패했습니다. 잠시 후 다시 시도해주세요.'); console.error(err); }
  btn.disabled=false;
};
addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  panel.classList.remove('open'); closeGrid(); closeInfo();
});

fit(); sync();
</script>
