<style>
:root{
  --ink:#0C121C; --rule:#243147; --cnu:#1B4FA0; --cnu-lit:#4886E0;
  --muted:#7C8698; --paper:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--ink);color:#E8ECF3;
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(115% 75% at 50% 0,rgba(27,79,160,.2),transparent 60%)}

header{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;
  padding:16px 24px 12px;border-bottom:1px solid var(--rule);position:relative;z-index:3}
.mark{font-size:11px;letter-spacing:.22em;color:var(--cnu-lit);font-weight:700}
h1{font-size:13px;font-weight:600;color:#C6CEDC}
h1 span{color:var(--muted);font-weight:400}
.range{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.05em;
  font-variant-numeric:tabular-nums}

main{flex:1 1 auto;position:relative;min-height:0;display:flex;
  align-items:center;justify-content:center;padding:20px 0 10px;z-index:2}

/* stage is sized in JS — never overflows */
.stage{position:relative;flex:0 0 auto}
.stack{position:absolute;inset:0;pointer-events:none}
.stack i{position:absolute;top:5px;bottom:5px;right:0;width:9px;
  background:linear-gradient(90deg,#DFE4EB,#AFB9C8);border-radius:0 3px 3px 0;
  transition:opacity .2s,transform .2s}
.book{position:absolute;inset:0;background:var(--paper);border-radius:2px;
  overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.55)}
.book.duo{background:transparent;box-shadow:none;overflow:visible;perspective:2600px}
.book.duo::after{display:none}
.book:not(.duo) .half,.book:not(.duo) .leaf{display:none}
.book.duo .sheet{display:none}
.sheet{position:absolute;inset:0;display:flex;background:var(--paper)}
.sheet img{flex:1 1 0;min-width:0;height:100%;object-fit:contain;display:block;
  background:var(--paper)}

/* ── two-page book: static halves + a 3D flipping leaf ── */
.half{position:absolute;top:0;bottom:0;width:50%;background:var(--paper);overflow:hidden}
.half.lh{left:0;border-radius:2px 0 0 2px;box-shadow:0 26px 60px rgba(0,0,0,.55)}
.half.rh{right:0;border-radius:0 2px 2px 0;box-shadow:0 26px 60px rgba(0,0,0,.55)}
.half img,.face img{width:100%;height:100%;object-fit:contain;display:block}
.half.lh::before{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;z-index:2;
  pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.13))}
.half.rh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;z-index:2;
  pointer-events:none;background:linear-gradient(270deg,transparent,rgba(0,0,0,.13))}
.half.empty{background:transparent;box-shadow:none}
.half.empty::before{display:none}
.leaf{position:absolute;top:0;bottom:0;width:50%;display:none;z-index:6;
  transform-style:preserve-3d;pointer-events:none}
.leaf.fwd{left:50%;transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.10),transparent 28%,
    transparent 72%,rgba(0,0,0,.04))}
.face.empty{background:transparent}
.book::after{content:"";position:absolute;inset:0 auto 0 0;width:22px;z-index:3;
  pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.13),transparent)}
.over{z-index:2}
@keyframes slideOut{to{transform:translateX(-6%) scale(.986);opacity:0}}
@keyframes slideIn{from{transform:translateX(-6%) scale(.986);opacity:0}}
.over.out{animation:slideOut .22s cubic-bezier(.4,0,.2,1) forwards}
.over.in{animation:slideIn .22s cubic-bezier(.4,0,.2,1) forwards}
@media (prefers-reduced-motion:reduce){.over.out,.over.in{animation-duration:.01s}}

.zone{position:absolute;top:0;bottom:0;width:50%;z-index:4;cursor:pointer}
.zone.l{left:0} .zone.r{right:0}

.nav{position:absolute;top:50%;translate:0 -50%;z-index:5;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--rule);background:rgba(12,18,28,.7);
  color:#C6CEDC;cursor:pointer;display:grid;place-items:center;
  transition:border-color .16s,color .16s,background .16s;backdrop-filter:blur(6px)}
.nav:hover:not(:disabled){border-color:var(--cnu-lit);color:#fff;background:rgba(27,79,160,.3)}
.nav:disabled{opacity:.24;cursor:default}
.nav:focus-visible{outline:2px solid var(--cnu-lit);outline-offset:3px}
.nav.prev{left:14px} .nav.next{right:14px}
.nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

footer{flex:0 0 auto;border-top:1px solid var(--rule);padding:9px 16px 12px;
  display:flex;flex-direction:column;gap:8px;position:relative;z-index:3}
.strip{display:flex;gap:7px;overflow-x:auto;padding:2px 4px;justify-content:center;
  scrollbar-width:thin;scroll-behavior:smooth}
.strip::-webkit-scrollbar{height:5px}
.strip::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.strip button{flex:0 0 auto;padding:0;border:1px solid transparent;background:none;
  cursor:pointer;border-radius:2px;line-height:0;opacity:.4;
  transition:opacity .15s,border-color .15s}
.strip button img{width:40px;display:block}
.strip button:hover{opacity:.82}
.strip button[aria-current="true"]{opacity:1;border-color:var(--cnu-lit)}
.strip button:focus-visible{outline:2px solid var(--cnu-lit);outline-offset:2px}

.bar{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--muted)}
.counter{font-variant-numeric:tabular-nums;letter-spacing:.07em;color:#C6CEDC}
.counter b{color:var(--cnu-lit);font-weight:700}
.label{letter-spacing:.1em;font-size:10px;text-transform:uppercase}
.tools{margin-left:auto;display:flex;gap:7px}
.tools button{border:1px solid var(--rule);background:none;color:var(--muted);
  font:inherit;font-size:11px;padding:5px 10px;border-radius:2px;cursor:pointer;
  transition:border-color .15s,color .15s}
.tools button:hover{border-color:var(--cnu-lit);color:#E8ECF3}
.tools button[aria-pressed="true"]{border-color:var(--cnu-lit);color:#E8ECF3}
.tools button:focus-visible{outline:2px solid var(--cnu-lit);outline-offset:2px}

@media (max-width:760px){
  header{padding:12px 14px 9px;flex-wrap:wrap;gap:7px}
  .range{width:100%;margin:0}
  .nav{display:none}
  .strip{justify-content:flex-start}
  .tools .hide-sm{display:none}
}

/* ── per-page feedback panel ── */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,94vw);z-index:40;
  background:#0F1622;border-left:1px solid var(--rule);display:flex;
  flex-direction:column;transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-18px 0 44px rgba(0,0,0,.45)}
#panel.open{transform:translateX(0)}
.p-head{display:flex;align-items:center;gap:9px;padding:13px 14px;
  border-bottom:1px solid var(--rule)}
.p-head .p-title{font-size:12px;font-weight:600;color:#C6CEDC}
.p-head select{margin-left:auto;background:#161F2E;color:#E8ECF3;font:inherit;
  font-size:11px;border:1px solid var(--rule);border-radius:2px;padding:4px 6px;
  max-width:150px}
.p-head button{border:none;background:none;color:var(--muted);font-size:17px;
  cursor:pointer;padding:2px 5px;line-height:1}
.p-head button:hover{color:#fff}
#fbList{flex:1 1 auto;overflow-y:auto;padding:12px 14px;display:flex;
  flex-direction:column;gap:9px;scrollbar-width:thin}
.fb-item{border:1px solid var(--rule);border-radius:3px;padding:9px 11px;
  background:rgba(27,79,160,.06)}
.fb-meta{display:flex;gap:8px;font-size:10px;color:var(--muted);margin-bottom:4px}
.fb-meta b{color:#9FB4D6;font-weight:600}
.fb-text{font-size:12px;line-height:1.55;color:#DDE4EF;white-space:pre-wrap;
  word-break:break-word}
.fb-none{font-size:11px;color:var(--muted);text-align:center;padding:26px 0}
#fbForm{border-top:1px solid var(--rule);padding:12px 14px;display:flex;
  flex-direction:column;gap:7px}
#fbForm input,#fbForm textarea{background:#161F2E;border:1px solid var(--rule);
  border-radius:2px;color:#E8ECF3;font:inherit;font-size:12px;padding:7px 9px}
#fbForm textarea{resize:none;height:74px;line-height:1.5}
#fbForm input:focus,#fbForm textarea:focus{outline:none;border-color:var(--cnu-lit)}
#fbForm .p-send{border:1px solid var(--cnu);background:rgba(27,79,160,.25);
  color:#E8ECF3;font:inherit;font-size:12px;padding:7px;border-radius:2px;
  cursor:pointer;transition:background .15s}
#fbForm .p-send:hover{background:rgba(27,79,160,.5)}
#fbForm .p-send:disabled{opacity:.4;cursor:default}
.p-note{font-size:10px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>

<header>
  <span class="mark">CNU</span>
  <h1>컴퓨터인공지능학부 <span>· 한학기 성과 모음</span></h1>
  <span class="range">2026학년도 1학기</span>
</header>

<main id="main">
  <button class="nav prev" id="prev" aria-label="이전 페이지">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

  <div class="stage" id="stage">
    <div class="stack" id="stack"></div>
    <div class="book" id="book">
      <div class="half lh" id="lh"></div>
      <div class="half rh" id="rh"></div>
      <div class="leaf" id="leaf">
        <div class="face front" id="lf"></div>
        <div class="face back" id="lb"></div>
      </div>
      <div class="sheet under" id="under"></div>
      <div class="sheet over"  id="over"></div>
    </div>
    <div class="zone l" id="zl"></div>
    <div class="zone r" id="zr"></div>
  </div>

  <button class="nav next" id="next" aria-label="다음 페이지">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</main>

<footer>
  <nav class="strip" id="strip" aria-label="페이지 목록"></nav>
  <div class="bar">
    <span class="counter"><b id="cur">1</b> / <span id="tot"></span></span>
    <span class="label" id="label"></span>
    <span class="tools">
      <button id="anim" class="hide-sm" aria-pressed="true">넘김 효과</button>
      <button id="dual">두쪽 보기</button>
      <button id="link">링크 복사</button>
      <button id="save">이 페이지 저장</button>
      <button id="pdf">PDF로 저장</button>
      <button id="fb">의견</button>
      <button id="full" class="hide-sm">전체화면</button>
    </span>
  </div>
</footer>

<aside id="panel" aria-label="페이지별 의견">
  <div class="p-head">
    <span class="p-title">수정 요청 · 의견</span>
    <select id="fbPage" aria-label="페이지 선택"></select>
    <button id="fbClose" aria-label="닫기">×</button>
  </div>
  <div id="fbList"></div>
  <form id="fbForm">
    <input id="fbName" placeholder="이름 (선택)" maxlength="30" autocomplete="off">
    <textarea id="fbText" placeholder="이 페이지에 대한 수정 요청이나 의견을 적어주세요" maxlength="500" required></textarea>
    <button class="p-send" id="fbSend">등록</button>
    <span class="p-note">등록한 내용은 모두에게 공개되며, 수정·삭제는 담당자에게 문의해주세요.</span>
  </form>
</aside>

<script>
const PAGES = [{"src": "pages/01.jpg", "thumb": "thumbs/01.jpg", "label": "표지", "w": 794, "h": 1123}, {"src": "pages/02.jpg", "thumb": "thumbs/02.jpg", "label": "인사말", "w": 794, "h": 1123}, {"src": "pages/03.jpg", "thumb": "thumbs/03.jpg", "label": "연혁", "w": 794, "h": 1123}, {"src": "pages/04.jpg", "thumb": "thumbs/04.jpg", "label": "진로현황", "w": 794, "h": 1123}, {"src": "pages/05.jpg", "thumb": "thumbs/05.jpg", "label": "SW중심대학", "w": 794, "h": 1123}, {"src": "pages/06.jpg", "thumb": "thumbs/06.jpg", "label": "BK21 plus", "w": 794, "h": 1123}, {"src": "pages/07.jpg", "thumb": "thumbs/07.jpg", "label": "정보보호 특성화대학", "w": 794, "h": 1123}, {"src": "pages/08.jpg", "thumb": "thumbs/08.jpg", "label": "COSS", "w": 794, "h": 1123}, {"src": "pages/09.jpg", "thumb": "thumbs/09.jpg", "label": "AI 인재양성 부트캠프", "w": 794, "h": 1123}, {"src": "pages/10.jpg", "thumb": "thumbs/10.jpg", "label": "학교 행사", "w": 794, "h": 1123}, {"src": "pages/11.jpg", "thumb": "thumbs/11.jpg", "label": "RESEARCH", "w": 794, "h": 1123}, {"src": "pages/12.jpg", "thumb": "thumbs/12.jpg", "label": "AWARDS", "w": 794, "h": 1123}, {"src": "pages/13.jpg", "thumb": "thumbs/13.jpg", "label": "학부 NEWS · 연구실 목록", "w": 794, "h": 1123}, {"src": "pages/14.jpg", "thumb": "thumbs/14.jpg", "label": "동아리 성과", "w": 794, "h": 1123}, {"src": "pages/15.jpg", "thumb": "thumbs/15.jpg", "label": "동아리 · ANA · SPG", "w": 794, "h": 1123}, {"src": "pages/16.jpg", "thumb": "thumbs/16.jpg", "label": "동아리 · ARGOS · CRAFT:ON · ADMIN", "w": 794, "h": 1123}, {"src": "pages/17.jpg", "thumb": "thumbs/17.jpg", "label": "마무리", "w": 794, "h": 1123}];
const $=id=>document.getElementById(id);
const stage=$('stage'), main=$('main'), over=$('over'), under=$('under'), strip=$('strip'), stack=$('stack');
const book=$('book'), lh=$('lh'), rh=$('rh'), leaf=$('leaf'), lf=$('lf'), lb=$('lb');
const V='4'; PAGES.forEach(p=>{p.src+='?v='+V; p.thumb+='?v='+V;});
const RATIO = PAGES[0].w / PAGES[0].h;
let i=0, busy=false, useAnim=true, spreadMode=innerWidth>860;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = PAGES.length;
/* spread s=0 is the cover alone; s>=1 shows pages [2s-1, 2s] */
const sOf = p => p===0 ? 0 : Math.ceil(p/2);
const sPages = s => s===0 ? [0] : [2*s-1, 2*s].filter(k=>k<N);
const vis = () => spreadMode ? sPages(sOf(i)) : [i];
/* which page sits on each side of spread s (null = bare table, no paper) */
const lay = s => ({ left:  s===0 ? null : (2*s-1 < N ? 2*s-1 : null),
                    right: s===0 ? 0    : (2*s   < N ? 2*s   : null) });
const imgTag = k => `<img src="${PAGES[k].src}" alt="${k+1}페이지 ${PAGES[k].label}">`;
function render(el, ps){
  el.innerHTML = ps.map(imgTag).join('');
}
function setPane(el, p){
  el.classList.toggle('empty', p==null);
  el.innerHTML = p==null ? '' : imgTag(p);
}
function renderSpread(s){ setPane(lh, lay(s).left); setPane(rh, lay(s).right); }
function applyMode(){
  book.classList.toggle('duo', spreadMode);
  if(spreadMode) renderSpread(sOf(i));
  else { render(under,[i]); render(over,[i]); }
}

$('tot').textContent = PAGES.length;

/* ── size the stage from the box that actually exists ── */
function fit(){
  const pv = spreadMode ? 2 : 1;
  const r = main.getBoundingClientRect();
  const side = r.width > 760 ? 128 : 24;
  let h = r.height, w = h * RATIO * pv;
  const maxW = r.width - side;
  if (w > maxW){ w = maxW; h = w / (RATIO * pv); }
  stage.style.width  = Math.floor(w) + 'px';
  stage.style.height = Math.floor(h) + 'px';
}
new ResizeObserver(()=>fit()).observe(main);
addEventListener('orientationchange', () => setTimeout(fit, 120));

/* ── paper edges: thinner as you advance ── */
for (let k=0;k<4;k++) stack.appendChild(document.createElement('i'));
function drawStack(){
  const ps = vis();
  const left = N - 1 - ps[ps.length-1];
  [...stack.children].forEach((e,k)=>{
    const on = k < Math.min(4,left);
    e.style.opacity = on ? (0.46 - k*0.085).toFixed(2) : 0;
    e.style.transform = `translateX(${on ? (k+1)*4 : 0}px) scaleY(${1-(k+1)*0.011})`;
  });
}

PAGES.forEach((p,k)=>{
  const b=document.createElement('button');
  b.innerHTML=`<img src="${p.thumb}" alt="">`;
  b.title=`${k+1}. ${p.label}`;
  b.setAttribute('aria-label',`${k+1}페이지 ${p.label}`);
  b.onclick=()=>go(k);
  strip.appendChild(b);
});

function sync(){
  const ps=vis(), nums=ps.map(k=>k+1).join('–');
  $('cur').textContent=nums;
  $('label').textContent=[...new Set(ps.map(k=>PAGES[k].label))].join(' | ');
  $('prev').disabled=ps[0]===0;
  $('next').disabled=ps[ps.length-1]===N-1;
  [...strip.children].forEach((b,k)=>b.setAttribute('aria-current',ps.includes(k)));
  strip.children[ps[0]].scrollIntoView({block:'nearest',inline:'center'});
  document.title=`${nums}. ${PAGES[ps[0]].label} · 컴퓨터인공지능학부 한학기 성과 모음`;
  history.replaceState(null,'',`#p${ps[0]+1}`);
  fit(); drawStack(); warm(); fbSync();
}

function setFace(el, p){
  el.classList.toggle('empty', p==null);
  el.innerHTML = p==null ? '' : imgTag(p);
}
function go(n){
  n=Math.max(0,Math.min(N-1,n));
  const curS = spreadMode ? sOf(i) : i;
  const tgtS = spreadMode ? sOf(n) : n;
  if(tgtS===curS||busy) return;
  const dir = tgtS>curS ? 1 : -1;
  const tp = spreadMode ? sPages(tgtS) : [n];  // target pages

  if(!useAnim || reduced){
    i=tp[0];
    if(spreadMode) renderSpread(tgtS);
    else { render(under,tp); render(over,tp); }
    sync(); return;
  }
  busy=true;

  if(!spreadMode){                 // 한쪽 보기: 슬라이드
    if(dir>0){
      render(under,tp);
      over.className='sheet over out';
    }else{
      render(under,[i]);
      render(over,tp);
      over.className='sheet over in';
    }
    setTimeout(()=>{
      i=tp[0];
      over.className='sheet over';
      render(over,tp); render(under,tp);
      sync(); busy=false;
    },230);
    return;
  }

  // 두쪽 보기: 낱장이 책등을 축으로 3D 회전
  const A=lay(curS), B=lay(tgtS);
  if(dir>0){                       // 오른쪽 장을 왼쪽으로 젖힘
    setPane(lh, A.left); setPane(rh, B.right);
    setFace(lf, A.right); setFace(lb, B.left);
    leaf.className='leaf fwd';
  }else{                           // 왼쪽 장을 오른쪽으로 되넘김
    setPane(lh, B.left); setPane(rh, A.right);
    setFace(lf, A.left); setFace(lb, B.right);
    leaf.className='leaf bwd';
  }
  leaf.style.transition='none';
  leaf.style.transform='rotateY(0deg)';
  leaf.style.display='block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    leaf.style.transition='transform .65s cubic-bezier(.36,.1,.22,1)';
    leaf.style.transform=`rotateY(${dir>0?-180:180}deg)`;
  }));
  setTimeout(()=>{
    i=tp[0]; renderSpread(tgtS);
    leaf.style.display='none';
    leaf.style.transition='none';
    leaf.style.transform='rotateY(0deg)';
    sync(); busy=false;
  },700);
}
const nextP=()=>{const ps=vis();go(ps[ps.length-1]+1)};
const prevP=()=>go(vis()[0]-1);

$('next').onclick=nextP; $('prev').onclick=prevP;
$('zr').onclick=nextP;   $('zl').onclick=prevP;

addEventListener('keydown',e=>{
  if(e.target&&e.target.matches&&e.target.matches('input,textarea,select')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){nextP();e.preventDefault();}
  if(e.key==='ArrowLeft' ||e.key==='PageUp'  ){prevP();e.preventDefault();}
  if(e.key==='Home')go(0);
  if(e.key==='End')go(PAGES.length-1);
});

let x0=null,y0=null;
addEventListener('touchstart',e=>{
  if(e.target.closest('#panel')){x0=null;return;}
  x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)) dx<0?nextP():prevP();
  x0=null;
},{passive:true});

$('anim').onclick=e=>{useAnim=!useAnim;e.currentTarget.setAttribute('aria-pressed',useAnim)};
$('link').onclick=async e=>{
  try{ await navigator.clipboard.writeText(location.href);
       const b=e.currentTarget, t=b.textContent; b.textContent='복사됨';
       setTimeout(()=>b.textContent=t,1400);
  }catch{ prompt('링크를 복사하세요', location.href); }
};
$('save').onclick=()=>{
  vis().forEach((k,j)=>setTimeout(()=>{
    const a=document.createElement('a');
    a.href=PAGES[k].src; a.download=`브로셔_${String(k+1).padStart(2,'0')}.jpg`; a.click();
  },j*350));
};
$('pdf').onclick=()=>{
  const a=document.createElement('a');
  a.href='brochure.pdf'; a.download='CNU_컴퓨터인공지능학부_성과모음.pdf'; a.click();
};
$('dual').setAttribute('aria-pressed',spreadMode);
$('dual').onclick=e=>{
  spreadMode=!spreadMode;
  e.currentTarget.setAttribute('aria-pressed',spreadMode);
  applyMode(); fit(); sync();
};
$('full').onclick=()=>document.fullscreenElement
  ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange',()=>{
  $('full').textContent=document.fullscreenElement?'전체화면 해제':'전체화면';
  setTimeout(fit,120);
});

function warm(){[i-1,i+1,i+2].forEach(k=>{
  if(k>=0&&k<PAGES.length&&!PAGES[k]._w){PAGES[k]._w=1;const im=new Image();im.src=PAGES[k].src;}
});}
const hash=parseInt((location.hash.match(/p(\d+)/)||[])[1]);
if(hash>=1&&hash<=PAGES.length) i=hash-1;
applyMode();
addEventListener('hashchange',()=>{
  const h=parseInt((location.hash.match(/p(\d+)/)||[])[1]);
  if(h>=1&&h<=PAGES.length&&h-1!==i) go(h-1);
});
/* ── 페이지별 의견 (Firebase Firestore) ── */
const FB_CONFIG = {
  apiKey: "AIzaSyBvQmM6KVcawROxuoBRUza--EkTZHF6K2Y",
  authDomain: "cnu-scai-brochure.firebaseapp.com",
  projectId: "cnu-scai-brochure",
  storageBucket: "cnu-scai-brochure.firebasestorage.app",
  messagingSenderId: "689372314177",
  appId: "1:689372314177:web:af80f535c3683ab16164c0"
};
const panel=$('panel'), fbList=$('fbList'), fbPageSel=$('fbPage');
let fbDb=null, fbFs=null, fbAll=[], fbBooted=false;
if(!FB_CONFIG) $('fb').style.display='none';
PAGES.forEach((p,k)=>{
  const o=document.createElement('option');
  o.value=k+1; o.textContent=`${k+1}p · ${p.label}`;
  fbPageSel.appendChild(o);
});
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawFb(){
  const sel=+fbPageSel.value;
  const rows=fbAll.filter(d=>d.page===sel)
    .sort((a,b)=>((b.ts&&b.ts.seconds)||9e12)-((a.ts&&a.ts.seconds)||9e12));
  fbList.innerHTML = rows.length ? rows.map(d=>{
    const t=d.ts?new Date(d.ts.seconds*1000):null;
    const when=t?`${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`:'방금';
    return `<div class="fb-item"><div class="fb-meta"><b>${esc(d.name||'익명')}</b><span>${when}</span></div><div class="fb-text">${esc(d.text||'')}</div></div>`;
  }).join('') : '<div class="fb-none">아직 등록된 의견이 없습니다.<br>첫 의견을 남겨주세요.</div>';
}
async function fbInit(){
  if(fbBooted||!FB_CONFIG) return;
  fbBooted=true;
  try{
    const [app,fs]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    fbFs=fs; fbDb=fs.getFirestore(app.initializeApp(FB_CONFIG));
    fs.onSnapshot(fs.collection(fbDb,'feedback'),snap=>{
      fbAll=snap.docs.map(d=>d.data()); drawFb();
    },err=>{fbList.innerHTML='<div class="fb-none">의견을 불러오지 못했습니다.</div>';console.error(err);});
  }catch(err){
    fbBooted=false;
    fbList.innerHTML='<div class="fb-none">연결에 실패했습니다. 잠시 후 다시 열어주세요.</div>';
    console.error(err);
  }
}
function fbSync(){
  if(!panel.classList.contains('open')) return;
  const p=vis()[0]+1;
  if(+fbPageSel.value!==p){ fbPageSel.value=p; drawFb(); }
}
$('fb').onclick=()=>{ panel.classList.add('open'); fbPageSel.value=vis()[0]+1; drawFb(); fbInit(); };
$('fbClose').onclick=()=>panel.classList.remove('open');
fbPageSel.onchange=drawFb;
$('fbForm').onsubmit=async e=>{
  e.preventDefault();
  if(!fbDb) return;
  const text=$('fbText').value.trim(); if(!text) return;
  const btn=$('fbSend'); btn.disabled=true;
  try{
    await fbFs.addDoc(fbFs.collection(fbDb,'feedback'),{
      page:+fbPageSel.value,
      name:$('fbName').value.trim().slice(0,30),
      text:text.slice(0,500),
      ts:fbFs.serverTimestamp()
    });
    $('fbText').value='';
  }catch(err){ alert('등록에 실패했습니다. 잠시 후 다시 시도해주세요.'); console.error(err); }
  btn.disabled=false;
};
addEventListener('keydown',e=>{ if(e.key==='Escape') panel.classList.remove('open'); });

fit(); sync();
</script>
